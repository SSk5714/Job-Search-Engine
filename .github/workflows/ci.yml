name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: jobpilot_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run: { working-directory: backend }
    env:
      JOBPILOT_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/jobpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: PostgreSQL 16 client (pg_dump for backup tests)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-16
          echo "JOBPILOT_PG_DUMP_PATH=/usr/lib/postgresql/16/bin/pg_dump" >> "$GITHUB_ENV"
          echo "JOBPILOT_PG_RESTORE_PATH=/usr/lib/postgresql/16/bin/pg_restore" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]" pip-audit==2.9.0 ruff==0.12.11
      - run: playwright install --with-deps chromium
      - name: Lint
        run: ruff check jobpilot tests --select E9,F63,F7,F82,F401,F841,B006,B008 --ignore B008
      - name: Dependency audit
        run: pip-audit --progress-spinner off --skip-editable
      - name: Tests (unit, integration, real Redis + Celery)
        run: pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images and smoke-test the full stack (incl. backup and restore drill)
        run: infra/smoke-test.sh
      - name: Container logs
        if: always()
        run: cat smoke-logs.txt || true
