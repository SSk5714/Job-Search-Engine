# Local stack: docker compose -f infra/docker-compose.yml --env-file .env up --build
# Web UI on http://localhost:3000, API on http://localhost:8000 (docs at /docs).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      POSTGRES_DB: jobpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
    env_file: ../.env
    environment:
      JOBPILOT_DATABASE_URL: postgresql+psycopg://jobpilot:${POSTGRES_PASSWORD:-jobpilot}@postgres:5432/jobpilot
      JOBPILOT_REDIS_URL: redis://redis:6379/0
    volumes: [documents:/app/storage/documents]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
    env_file: ../.env
    environment:
      JOBPILOT_DATABASE_URL: postgresql+psycopg://jobpilot:${POSTGRES_PASSWORD:-jobpilot}@postgres:5432/jobpilot
      JOBPILOT_REDIS_URL: redis://redis:6379/0
    command: celery -A jobpilot.worker worker -l info --concurrency 2
    volumes: [documents:/app/storage/documents]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  beat:  # sends the orchestrator's scheduler tick once a minute (scheduled searches, follow-ups, emails)
    build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
    env_file: ../.env
    environment:
      JOBPILOT_DATABASE_URL: postgresql+psycopg://jobpilot:${POSTGRES_PASSWORD:-jobpilot}@postgres:5432/jobpilot
      JOBPILOT_REDIS_URL: redis://redis:6379/0
    command: celery -A jobpilot.worker beat -l info -s /tmp/celerybeat-schedule
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  monitor:  # independent: own loop and heartbeat, no Celery; keeps working when the queue or scheduler fail
    build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
    env_file: ../.env
    environment:
      JOBPILOT_DATABASE_URL: postgresql+psycopg://jobpilot:${POSTGRES_PASSWORD:-jobpilot}@postgres:5432/jobpilot
      JOBPILOT_REDIS_URL: redis://redis:6379/0
      JOBPILOT_MONITOR_FALLBACK_LOG: /app/storage/monitor/fallback.jsonl
    command: python -m jobpilot.monitor
    volumes: [documents:/app/storage/documents:ro, monitorlog:/app/storage/monitor]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  mock-portal:  # demo/test employer portal; remove in real use
    image: python:3.12-slim
    working_dir: /portal
    volumes: [../mock-portal:/portal:ro]
    command: sh -c "pip install -q fastapi==0.115.14 uvicorn==0.32.1 python-multipart && uvicorn mock_portal:app --host 0.0.0.0 --port 8100"
    ports: ["8100:8100"]
    profiles: [demo]

  web:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args: { JOBPILOT_API_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  monitorlog:  # monitor's fallback log when the database is unreachable
  documents:  # generated CVs and cover letters: back this up with the database
